{% extends 'base.html' %}
{% block content %}

<div style="max-width: 440px; margin: 60px auto; font-family: 'Segoe UI', system-ui, sans-serif;">

    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 1.8rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px;">
            Login
        </h1>
        <p style="color: #666; margin: 0;">
            Sign in to continue the study
        </p>
    </div>

    <div style="background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.07);
                padding: 36px 40px; border: 1px solid #f0f0f0;">

        {% if form.errors %}
            <div style="background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;
                        padding: 12px 16px; border-radius: 8px; margin-bottom: 22px; font-size: 0.95rem;">
                Your username and password didn’t match. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div style="margin-bottom: 22px;">
                <label for="id_username"
                       style="display: block; font-weight: 600; margin-bottom: 7px; color: #333;">
                    Username
                </label>
                <input type="text" name="username" id="id_username" required autofocus
                       style="width: 100%; padding: 12px 14px; border: 1px solid #ced4da;
                              border-radius: 8px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 28px;">
                <label for="id_password"
                       style="display: block; font-weight: 600; margin-bottom: 7px; color: #333;">
                    Password
                </label>
                <input type="password" name="password" id="id_password" required
                       style="width: 100%; padding: 12px 14px; border: 1px solid #ced4da;
                              border-radius: 8px; font-size: 1rem;">
            </div>

            <button type="submit"
                    style="width: 100%; padding: 14px; background: linear-gradient(135deg, #4361ee, #3a0ca3);
                           color: white; border: none; border-radius: 10px; font-size: 1.05rem;
                           font-weight: 600; cursor: pointer;
                           box-shadow: 0 4px 14px rgba(67, 97, 238, 0.35);">
                Login
            </button>
        </form>
    </div>

    <p style="text-align: center; margin-top: 24px; color: #555;">
        Don’t have an account?
        <a href="{% url 'users:register' %}" style="color: #4361ee; font-weight: 600; text-decoration: none;">
            Register here
        </a>
    </p>
</div>

<style>
    input[type="text"]:focus,
    input[type="password"]:focus {
        outline: none;
        border-color: #4361ee !important;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
    }
</style>

{% endblock %}
