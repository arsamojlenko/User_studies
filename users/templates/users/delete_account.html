{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 500px; margin: 40px auto;">
    <h2 style="color: #dc3545;">Delete Account</h2>
    
    <p><strong>Warning:</strong> This action is permanent and cannot be undone.</p>
    <p>All your test results and data will be deleted.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white; padding: 10px 20px;">
            Yes, permanently delete my account
        </button>
    </form>

    <p style="margin-top: 20px;">
        <a href="{% url 'core:dashboard' %}">← Cancel and go back</a>
    </p>
</div>

{% endblock %}
