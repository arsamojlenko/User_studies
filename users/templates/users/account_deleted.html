{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 550px; margin: 60px auto; text-align: center;">
    <h1>Thank you for your participation</h1>
    
    <p style="font-size: 1.1em; margin: 25px 0;">
        Your account and all your data have been permanently deleted.
    </p>

    <p>We appreciate your contribution to this study.</p>

    <div style="margin-top: 40px;">
        <a href="{% url 'login' %}" 
           style="display: inline-block; padding: 12px 28px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 0 10px;">
            Go to Login
        </a>

        <a href="{% url 'users:register' %}" 
           style="display: inline-block; padding: 12px 28px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; margin: 0 10px;">
            Create a new account
        </a>
    </div>
</div>

{% endblock %}
