{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 450px; margin: 40px auto;">
    <h2>Change Password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
    </form>

    <p style="margin-top: 20px;">
        <a href="{% url 'core:dashboard' %}">← Back to Dashboard</a>
    </p>
</div>

{% endblock %}
